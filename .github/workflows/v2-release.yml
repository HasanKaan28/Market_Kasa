name: v2 release

# Runs only by hand or on a v2.* tag. Nothing here runs on a push to a branch, so merging v2 into
# main never redeploys the live app (DESIGN K13). The web app reaches GitHub Pages from a v2.* tag,
# or from a run started by hand with "deploy_pages" ticked.
on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy the web build to GitHub Pages (replaces the live web app)'
        type: boolean
        default: false
  push:
    tags: ['v2.*']

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # A release built without the server works offline and hides pairing, silently.
      - name: Release has the server address
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the repository variables VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: market-kasa-web
          path: dist
          if-no-files-found: error

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run cap:sync
      - run: chmod +x android/gradlew
      # Signed with the same release key every time, so each APK installs over the last one and
      # keeps its data. A tag refuses to ship without the key; a run by hand falls back to debug.
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export MK_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
            (cd android && ./gradlew assembleRelease)
            cp android/app/build/outputs/apk/release/app-release.apk out/Market-Kasa.apk
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK must be signed with the release key."
            exit 1
          else
            (cd android && ./gradlew assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/Market-Kasa-${GITHUB_REF_NAME//\//-}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: market-kasa-android
          path: out/*.apk
          if-no-files-found: error

  build-windows:
    needs: build-web
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run electron:installer -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: market-kasa-windows
          # latest.yml and the blockmap are the desktop update feed: installed apps read them.
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: market-kasa-{android,windows}
          merge-multiple: true
      # A draft: nothing is public until someone reads it and presses Publish.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Market Kasa ${{ github.ref_name }}
          body: |
            **Kurmadan önce yedek alın.**
            - v1'den geçiyorsanız: v1'de Ayarlar → Yedek İndir (JSON). v2 kurulunca v1'in verisi okunamaz.
            - Android: v1'in üstüne kurulamaz; v1'i kaldırmak verisini de siler. v2'nin sonraki sürümleri bunun üstüne kurulur.
            - İlk açılışta "Market kur" ile kendi e-postanızla marketi açın. Diğer bilgisayar ve telefonlarda aynı e-posta ve şifreyle "Markete giriş yap": her cihaz sıradaki kasa olur (K2, K3…).
          generate_release_notes: true
          files: |
            release-files/*.apk
            release-files/*.exe
            release-files/*.exe.blockmap
            release-files/latest.yml

  deploy-pages:
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || startsWith(github.ref, 'refs/tags/v2.')
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The site (site/) is the front page; the app itself opens under app/.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
      - uses: actions/download-artifact@v4
        with:
          name: market-kasa-web
          path: pages/app
      - run: cp -r site/. pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
